<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#07c160">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NICO小记">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="favicon-32.png">
<title>NICO小记</title>
<style>
  :root{
    --wx:#07c160; --wx-dark:#06ad56; --wx-bubble:#95ec69;
    --bg:#ededed; --nav:#ededed; --cell:#ffffff;
    --ink:#111; --ink2:#888; --line:#ececec;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;}
  html,body{height:100%;}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",Roboto,sans-serif; background:var(--bg); color:var(--ink);
    font-size:16px; max-width:480px; margin:0 auto; min-height:100%; -webkit-font-smoothing:antialiased;}
  #app{padding-bottom:60px; min-height:100vh;}
  /* 顶部导航栏（微信样式） */
  .topbar{position:sticky; top:0; z-index:20; background:var(--nav); height:50px; display:flex; align-items:center;
    padding:0 8px; border-bottom:1px solid var(--line);}
  .topbar .back{font-size:22px; padding:6px 12px; cursor:pointer; color:#111; line-height:1;}
  .topbar .title{flex:1; text-align:center; font-size:17px; font-weight:500; margin-right:40px;}
  .topbar .title small{font-size:12px; color:var(--ink2); margin-left:6px; font-weight:400;}
  .topbar .sp{width:46px;}
  /* 英雄区 */
  .hero{padding:14px 14px 6px;}
  .hero .box{background:linear-gradient(135deg,#07c160,#06ad56); color:#fff; border-radius:14px; padding:18px 18px 16px; box-shadow:0 6px 18px rgba(7,193,96,.22);}
  .hero .greet{font-size:14px; opacity:.92;}
  .hero h1{font-size:20px; font-weight:700; margin:6px 0 4px; line-height:1.35; word-break:break-word;}
  .hero .sub{font-size:12px; opacity:.9;}
  /* 统计块 */
  .statrow{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:12px 14px 4px;}
  .stat{background:var(--cell); border-radius:12px; padding:14px 6px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,.04);}
  .stat .num{font-size:22px; font-weight:700; color:var(--wx);}
  .stat .lbl{font-size:11px; color:var(--ink2); margin-top:3px;}
  /* 微信单元格 */
  .cgroup{background:var(--cell); margin:10px 0; }
  .cgroup .gtitle{padding:10px 16px 2px; font-size:13px; color:var(--ink2);}
  .cell{display:flex; align-items:center; padding:13px 16px; position:relative;}
  .cell::after{content:""; position:absolute; left:16px; right:0; bottom:0; height:1px; background:var(--line);}
  .cell:last-child::after{display:none;}
  .cell .ic{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; margin-right:12px;}
  .cell .t{flex:1; font-size:16px; min-width:0;}
  .cell .t .sub{font-size:12px; color:var(--ink2); margin-top:1px;}
  .cell .val{color:var(--ink2); font-size:13px; margin-right:4px;}
  .cell.dorm-room{min-height:60px;}
  .cell.dorm-room .t{min-width:120px;}
  .cell.dorm-room .val{flex:0 1 auto; min-width:0; white-space:normal; word-break:break-word; line-height:1.5; text-align:left; padding-left:10px; color:#333;}
  .cell .chev{color:#c8c8c8; font-size:18px; flex-shrink:0;}
  .cell .bdg{background:#fa5151; color:#fff; font-size:11px; border-radius:10px; padding:1px 7px; margin-right:6px; flex-shrink:0; font-weight:600;}
  /* 头像 */
  .av{width:44px; height:44px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:600; font-size:17px; flex-shrink:0;}
  .av.round{border-radius:50%;}
  /* 按钮 */
  .btn{display:inline-flex; align-items:center; justify-content:center; border:none; background:var(--wx); color:#fff;
    font-size:16px; font-weight:500; padding:11px 0; border-radius:8px; width:100%; cursor:pointer;}
  .btn:active{background:var(--wx-dark);}
  .btn.ghost{background:#fff; color:#111; border:1px solid #d9d9d9;}
  .btn.blue{background:#576b95;} .btn.red{background:#fa5151;}
  .btn-row{display:flex; gap:10px;} .btn-row .btn{margin:0;}
  /* 表单（微信风格） */
  .fgroup{background:#fff; margin:10px 0;}
  .fcell{padding:12px 16px; display:flex; align-items:center; border-bottom:1px solid var(--line);}
  .fcell:last-child{border-bottom:none;}
  .fcell label{width:86px; color:#333; font-size:15px; flex-shrink:0;}
  .fcell input,.fcell select,.fcell textarea{flex:1; border:none; outline:none; font-size:15px; box-shadow:none; background:transparent; color:#111;}
  .fcell textarea{min-height:70px; resize:vertical; padding:2px 0;}
  .fcell select{color:#111; appearance:auto;}
  .fgroup .hint{padding:6px 16px; font-size:12px; color:var(--ink2);}
  /* 微信标签 */
  .wx-badge{background:#fa5151; color:#fff; border-radius:10px; min-width:18px; height:18px; font-size:11px; display:inline-flex; align-items:center; justify-content:center; padding:0 5px;}
  /* 聊天 */
  .chatwrap{background:#ededed; min-height:calc(100vh - 50px - 52px);}
  .chat-day{text-align:center; font-size:12px; color:#888; padding:14px 0 6px;}
  .msgs{padding:0 14px 14px;}
  .msg{display:flex; margin-bottom:14px;}
  .msg .av{width:40px; height:40px; border-radius:6px; margin-right:10px;}
  .msg.right{flex-direction:row-reverse;}
  .msg.right .av{margin-right:0; margin-left:10px;}
  .b{max-width:72%; padding:10px 12px; border-radius:8px; font-size:15px; line-height:1.4; word-break:break-word; position:relative;}
  .msg.left .b{background:#fff; color:#111;}
  .msg.right .b{background:var(--wx-bubble); color:#0a0a0a;}
  .b .when{display:block; font-size:10px; color:#999; margin-top:5px;}
  .inputbar{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:#f5f5f5;
    display:flex; align-items:center; gap:8px; padding:9px 10px calc(9px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); z-index:30;}
  .inputbar input{flex:1; border:none; border-radius:8px; padding:9px 12px; font-size:15px; background:#fff; outline:none;}
  .inputbar .send{background:var(--wx); color:#fff; border:none; border-radius:8px; padding:9px 16px; font-size:15px; cursor:pointer;}
  /* 底部 Tab（微信样式） */
  .tabbar{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:#f7f7f7;
    border-top:1px solid #ddd; display:grid; grid-template-columns:repeat(5,1fr); padding:5px 0 calc(5px + env(safe-area-inset-bottom)); z-index:40;}
  .tabbar .tab{display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none; cursor:pointer; color:#c3c3c3;}
  .tabbar .tab .ti{font-size:22px; line-height:1;}
  .tabbar .tab .tl{font-size:11px;}
  .tabbar .tab.on{color:var(--wx);}
  .tabbar .tab.on .ti{color:var(--wx);}
  .list-msg{display:flex; align-items:center; padding:12px 16px; background:#fff; border-bottom:1px solid var(--line);}
  .list-msg .mid{flex:1; margin-left:12px; min-width:0;}
  .list-msg .mid .name{font-size:16px;}
  .list-msg .mid .prev{font-size:13px; color:#999; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .list-msg .right{text-align:right; flex-shrink:0;}
  .list-msg .right .time{font-size:12px; color:#c3c3c3;}
  .list-msg .right .dot{display:inline-block; width:9px; height:9px; background:#fa5151; border-radius:50%; margin-top:6px;}
  .empty{text-align:center; color:#999; padding:60px 0; font-size:14px;}
  .empty .eic{font-size:42px; display:block; margin-bottom:8px;}
  .seg{display:flex; background:#fff; margin-bottom:10px; border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .seg button{flex:1; background:none; border:none; padding:11px 0; font-size:15px; color:var(--ink2); cursor:pointer; border-bottom:2px solid transparent;}
  .seg button.on{color:var(--wx); border-bottom-color:var(--wx); font-weight:600;}
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:60; display:none; align-items:flex-end; justify-content:center;}
  .modal-bg.show{display:flex;}
  .sheet{background:#fff; width:100%; max-width:480px; border-radius:14px 14px 0 0; padding:16px 0 calc(16px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;}
  .modal-bg{overscroll-behavior:contain;}
  .sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
  .sheet .sh{text-align:center; font-size:16px; font-weight:600; padding:0 16px 12px; position:relative;}
  .sheet .sh .close{position:absolute; right:16px; top:-2px; font-size:24px; color:#999; cursor:pointer;}
  .sheet .fd{padding:0 16px;}
  .sheet .acts{display:flex; gap:10px; padding:16px 16px 0;}
  .toast{position:fixed; left:50%; bottom:80px; transform:translateX(-50%); background:rgba(0,0,0,.8); color:#fff; padding:10px 18px; border-radius:10px; font-size:14px; z-index:90; opacity:0; transition:.25s; pointer-events:none; max-width:80%; text-align:center;}
  .toast.show{opacity:1;}
  .profile-hd{background:#fff; padding:26px 0; display:flex; align-items:center; justify-content:center; gap:16px;}
  .profile-hd .av{width:64px; height:64px; border-radius:12px; font-size:28px;}
  .profile-hd .pt .n{font-size:19px; font-weight:600;}
  .profile-hd .pt .s{font-size:13px; color:var(--ink2); margin-top:4px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{padding:7px 15px; border-radius:6px; background:#f2f2f2; font-size:14px; cursor:pointer;}
  .chip.on{background:var(--wx); color:#fff;}
  .pillrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
  .tag{font-size:11px; padding:2px 8px; border-radius:4px; background:#f0f0f0; color:#666;}
  .bar{height:6px; border-radius:3px; background:#f0f0f0; overflow:hidden; margin-top:8px;}
  .bar i{display:block; height:100%; background:var(--wx); border-radius:3px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .ts{font-size:13px; color:var(--ink2);}
  .mt{margin-top:10px;}
  /* ===== 考试统计 ===== */
  .esbox{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:4px;}
  .esi{background:#f7f8fa; border-radius:8px; padding:6px 2px; text-align:center;}
  .esi .esn{font-size:15px; font-weight:700; color:var(--wx); line-height:1.2;}
  .esi .esl{font-size:10px; color:var(--ink2); margin-top:2px;}
  .esdist{display:flex; gap:5px; margin-top:8px; flex-wrap:nowrap;}
  .esd{flex:1; background:#f7f8fa; border-radius:6px; padding:5px 2px; text-align:center; font-size:11px; color:#555;}
  .esd b{color:var(--wx); font-size:13px; margin-left:2px;}
  .esd.off{opacity:.45;}
  .rank{color:#999; font-size:13px;}
  .mt4{margin-top:6px;}


  /* ===== 班级工具 / 生成器 ===== */
  .ctools{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px 0;}
  .ctool{background:#fff;border-radius:12px;padding:16px 12px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.04);cursor:pointer;}
  .ctool:active{background:#f2f2f2;}
  .ctool .ci{font-size:26px;line-height:1;}
  .ctool .cn{font-size:15px;font-weight:600;margin-top:8px;}
  .ctool .cs{font-size:11px;color:var(--ink2);margin-top:2px;}
  .gen-tools{padding:12px 14px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .gen-tools .field{display:flex;align-items:center;gap:6px;background:#fff;border-radius:8px;padding:6px 10px;font-size:14px;border:1px solid #ececec;}
  .gen-tools .field label{color:var(--ink2);font-size:13px;white-space:nowrap;}
  .gen-tools .field input,.gen-tools .field select{width:70px;border:1px solid #e5e5e5;border-radius:6px;padding:6px 8px;font-size:14px;background:#fff;}
  .gen-tools .seg{flex-basis:100%;margin:0 0 2px;}
  .seat-table{margin:12px 14px;background:#fff;border-radius:12px;padding:14px 8px;overflow-x:auto;border:1px solid #ececec;}
  .seat-grid{display:grid;gap:4px 8px;justify-content:center;min-width:480px;margin:0 auto;}
  .seat-grid .ghead{text-align:center;font-size:12px;color:#666;padding:8px 0 2px;font-weight:600;border-top:2px solid #07c160;}
  .seat-grid .ghead.gfoot{border-top:none;border-bottom:2px solid #07c160;padding:7px 0 2px;}
  .seat-cell{border:1px solid #cfcfcf;background:#fff;min-height:38px;display:flex;align-items:center;justify-content:center;font-size:13px;border-radius:3px;padding:4px 6px;white-space:nowrap;}
  .seat-cell.sp{background:#fdf3c2;border-color:#e0c860;color:#a9791a;font-weight:600;}
  .seat-cell .star{color:#e1870b;margin-left:2px;}
  .seat-cell.empty{background:#f7f7f7;color:#bbb;border-style:dashed;}
  .podium{margin:14px auto 4px;width:130px;text-align:center;border:2px solid #333;border-radius:4px;padding:8px 0;font-weight:600;background:#fff;}
  .seat-tip{font-size:12px;color:var(--ink2);padding:0 16px 10px;text-align:center;}
  .duty-table-wrap{margin:12px 14px;background:#fff;border-radius:12px;padding:6px;overflow-x:auto;border:1px solid #ececec;}
  table.duty{width:100%;border-collapse:collapse;font-size:14px;min-width:560px;}
  table.duty th,table.duty td{border:1px solid #cfcfcf;padding:8px 6px;text-align:center;vertical-align:middle;}
  table.duty th{background:#eef3ff;font-weight:600;}
  table.duty td .nm{color:#333;}
  .check-mini{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #e5e5e5;border-radius:8px;padding:5px 8px;font-size:13px;color:#333;}
  .check-mini input{width:auto;}
  .btn.mini{width:auto;padding:8px 14px;font-size:14px;}
  .btn.soft{background:#576b95;}
  .seat-cell{position:relative;}
  .seat-cell.sel{border:2px solid #07c160;background:#eef7f1;}
  .seat-cell .seat-x{position:absolute;top:1px;right:1px;width:16px;height:16px;background:rgba(250,81,81,.92);color:#fff;border-radius:50%;font-size:11px;line-height:16px;text-align:center;cursor:pointer;}
  .seat-cell .seat-add{color:#07c160;font-weight:700;margin-right:2px;}

  /* 课表 */
  .sched-scroll{overflow-x:auto;}
  table.sched{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
  table.sched th,table.sched td{border:1px solid #e3e3e3;padding:7px 6px;text-align:center;vertical-align:middle;}
  table.sched thead th{background:#eef3ff;font-weight:600;}
  table.sched td.daycol,table.sched th.daycol{background:#fafafa;font-weight:600;color:#576b95;width:84px;}
  table.sched td.daycol{font-size:12px;}
  .sched-cell{min-height:46px;font-size:13px;}
  .sched-cell small{display:block;color:#999;font-size:11px;margin-top:2px;}
  .sched-cell.mine{background:#e8f7ed;border-color:#8fd6a5;font-weight:700;color:#0a7a43;}
  .sched-wrap{background:#fff;margin:12px 0;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.04);overflow:hidden;}
  .sched-wrap .gtitle{background:#fff;}
  /* 家长沟通 · 号码 */
  .prow{font-size:12px;color:#576b95;margin-top:3px;}
  .chat-contact{display:flex;align-items:center;gap:12px;background:#fff;margin:10px 14px;border-radius:12px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.04);}
  .chat-contact .av{flex-shrink:0;}
  .chat-contact .cinfo{flex:1;min-width:0;}
  .chat-contact .cn{font-size:16px;font-weight:600;}
  .chat-contact .ctag{font-size:12px;color:#999;font-weight:400;margin-left:4px;}
  .chat-contact .crow{font-size:14px;color:#576b95;margin-top:3px;}
  .chat-contact .call{background:#07c160;color:#fff;border-radius:18px;padding:8px 14px;font-size:14px;text-decoration:none;flex-shrink:0;}
  /* 搜索弹层 */
  .searchwrap{padding:6px 0 2px;}
  .search-input{width:100%;border:1px solid #e3e3e3;border-radius:10px;padding:11px 14px;font-size:15px;outline:none;background:#f5f5f5;box-sizing:border-box;color:#111;-webkit-user-select:text;user-select:text;}
  .search-input:focus{border-color:#07c160;background:#fff;}
  .search-results{margin-top:8px;max-height:60vh;overflow-y:auto;}
  .printable{display:none;}
  @media print{
    body{background:#fff;}
    .tabbar,.topbar,.gen-tools,.no-print,.toast,.modal-bg{display:none!important;}
    #app{padding:0!important;}
    .seat-table,.duty-table-wrap{box-shadow:none;border:none;margin:0;padding:0;}
    .printable{display:block;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="modal-bg" id="modal"></div>
<div class="toast" id="toast"></div>
<div class="toast" id="toast2"></div>
<script>
/* ================== 工具 ================== */
const $ = s=>document.querySelector(s);
const $$ = s=>document.querySelectorAll(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad(n){return String(n).padStart(2,'0');}
function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayStr(){return fmtDate(new Date());}
function addDays(ds,n){const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n); return fmtDate(d);}
function weekdayCN(ds){const w=new Date(ds+'T00:00:00').getDay(); return ['周日','周一','周二','周三','周四','周五','周六'][w];}
function fmtCN(ds){if(!ds)return''; return (ds||'').replace(/^(\d{4})-(\d{2})-(\d{2})$/,'$1年$2月$3日');}
function fromNow(ds){if(!ds)return''; if(ds===todayStr())return'今天'; if(ds===addDays(todayStr(),1))return'明天'; if(ds===addDays(todayStr(),-1))return'昨天'; return (ds||'').slice(5);}
function hashName(n){let h=0; for(const c of (n||''))h=(h*31+c.charCodeAt(0))%360; return h;}
const AVC=['#07c160','#576b95','#fa9d3b','#e73b3b','#8a38f5','#f0766f','#57be6a','#10aeff'];
function avC(n){return AVC[hashName(n)%AVC.length];}
function toast(m){const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),1800);}
function confirmBox(m,fn){openSheet({title:'确认操作',body:'<p style="padding:12px 0">'+esc(m)+'</p>',onSave:fn,ok:'确认'});}
/*__APP__*/
/* ================== 数据 ================== */
const KEY='huang_teacher_workbench_v3';
let db=null;
const D_ST={un:'未交',done:'已交',full:'已订正'};
const H_ST={pending:'待收',submitted:'已交',late:'迟交',missing:'缺交'};

let examCls='all';
function examCols(e){
  const vals=Object.values(e.scores||{}).filter(function(v){return v!==''&&v!=null;}).map(function(v){return +v;});
  const n=vals.length; if(!n) return {n:0,avg:0,mx:0,mn:0,pass:0,passRate:0,excel:0,excelRate:0,dist:[0,0,0,0,0]};
  const avg=Math.round(vals.reduce(function(a,b){return a+b;},0)/n);
  const mx=Math.max.apply(null,vals); const mn=Math.min.apply(null,vals);
  const pass=vals.filter(function(v){return v>=60;}).length;
  const excel=vals.filter(function(v){return v>=85;}).length;
  const dist=[0,0,0,0,0]; vals.forEach(function(v){ if(v>=90)dist[0]++; else if(v>=80)dist[1]++; else if(v>=70)dist[2]++; else if(v>=60)dist[3]++; else dist[4]++; });
  return {n:n,avg:avg,mx:mx,mn:mn,pass:pass,passRate:Math.round(pass/n*100),excel:excel,excelRate:Math.round(excel/n*100),dist:dist};
}

async function dbToCode(){const json=JSON.stringify(db);
  try{ if(typeof CompressionStream==='function'){ const stream=new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw')); const buf=await new Response(stream).arrayBuffer(); const bytes=new Uint8Array(buf); let s=''; for(let i=0;i<bytes.length;i+=0x8000){ s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000)); } return 'NICO1:'+btoa(s); } }catch(e){}
  return 'NICO0:'+btoa(unescape(encodeURIComponent(json)));}
async function codeToDb(code){code=(code||'').trim(); let json;
  try{ if(code.indexOf('NICO1:')===0){ const bin=atob(code.slice(6)); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i); const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')); json=await new Response(stream).text(); } else if(code.indexOf('NICO0:')===0){ json=decodeURIComponent(escape(atob(code.slice(6)))); } else { throw 0; } }catch(e){ throw new Error('同步码格式不正确'); }
  let data; try{ data=JSON.parse(json); }catch(e){ throw new Error('同步码解析失败'); }
  if(!data||!Array.isArray(data.students)) throw new Error('同步码数据不完整');
  return data;}

function initSeat(){ if(!seatSt._init){ if(db.seatPreset&&db.seatPreset.groups){ seatSt.groups=db.seatPreset.groups; if(db.seatPreset.rows)seatSt.rows=db.seatPreset.rows; } else { const n=db.students.length; seatSt.groups=Math.max(2,Math.min(8,Math.ceil(n/7))); } seatSt._init=1; } }
function seatSet(k,v){ if(k==='rows')seatSt.rows=Math.max(0,parseInt(v)||0); else if(k==='groups')seatSt.groups=Math.max(2,parseInt(v)||8); else seatSt[k]=v; seatAuto(); render(); }
function seatAuto(){
  const cols=seatSt.groups; const groups={}; const order=[];
  if(seatSt.byGroup){ db.students.forEach(function(s){ const g=s.group||'未分组'; if(!groups[g]){groups[g]=[]; order.push(g);} groups[g].push(s); }); }
  else { for(let i=0;i<cols;i++){ const g='第'+(i+1)+'组'; order.push(g); groups[g]=[]; } db.students.forEach(function(s,i){ groups[order[i%cols]].push(s); }); }
  if(seatSt.front){ order.forEach(function(g){ const arr=groups[g]; const idx=arr.findIndex(function(s){return s.special;}); if(idx>=0&&idx!==arr.length-1){ const sp=arr.splice(idx,1)[0]; arr.push(sp); } }); }
  let rows=seatSt.rows>0?seatSt.rows:Math.max.apply(null,[1].concat(order.map(function(g){return groups[g].length;})));
  const matrix=order.map(function(g){ return Array.from({length:rows},function(_,ri){ const s=groups[g][ri]; return s?s.id:null; }); });
  db.seat={groups:order,matrix:matrix,rows:rows}; seatSel=null; save();
}
function seatEnsure(){ if(!db.seat||!db.seat.matrix||!db.seat.matrix.length)seatAuto(); }
function seatProject(){
  seatEnsure(); const sg=db.seat;
  const matrix=sg.matrix.map(function(col){ return col.map(function(id){ return id?(db.students.find(function(s){return s.id===id;})||null):null; }); });
  return {groups:sg.groups,matrix:matrix,rows:matrix.length?matrix[0].length:0};
}
function seatTableHTML(){
  const p=seatProject(); const cols=p.groups.length, rows=p.rows;

  for(let ri=0;ri<rows;ri++){
    p.groups.forEach(function(gl,ci){
      const s=p.matrix[ci][ri]; const sel=seatSel&&seatSel.c===ci&&seatSel.r===ri;
      const cellCls='seat-cell '+(s?(s.special?'sp':''):'empty')+(sel?' sel':'');
      if(s){
        grid+='<div class="'+cellCls+'" onclick="seatTap('+ci+','+ri+')">'+esc(s.name)+(s.special?'<span class="star">☆</span>':'')
          +'<span class="seat-x" onclick="event.stopPropagation();seatRemove('+ci+','+ri+')">✕</span></div>';
      } else {
        grid+='<div class="'+cellCls+'" onclick="seatTap('+ci+','+ri+')"><span class="seat-add" onclick="event.stopPropagation();seatAddPick('+ci+','+ri+')">＋</span>空</div>';
      }
    });
  }
  p.groups.forEach(function(g){ grid+='<div class="ghead gfoot">'+esc(g)+'</div>'; });
  grid+='</div>';
  const un=unseatedStudents();
  const pool=(un.length?('<div class="no-print"><div class="gtitle" style="padding:12px 16px 0">未入座学生 · '+un.length+'人</div><div class="chips" style="padding:6px 16px 12px">'+un.map(function(s){return '<span class="chip" style="cursor:pointer" onclick="seatAddUnseated(\''+s.id+'\')">'+esc(s.name)+'</span>';}).join('')+'</div></div>'):'');

}
function unseatedStudents(){ const used={}; seatEnsure(); db.seat.matrix.forEach(function(col){ col.forEach(function(id){ if(id)used[id]=1; }); }); return db.students.filter(function(s){ return !used[s.id]; }); }
function seatTap(c,r){

function seatMove(c1,r1,c2,r2){ const a=db.seat.matrix; const t=a[c1][r1]; a[c1][r1]=a[c2][r2]; a[c2][r2]=t; save(); render(); }
function seatRemove(c,r){ const id=db.seat.matrix[c][r]; if(!id)return; const s=db.students.find(function(x){return x.id===id;}); confirmBox('将 '+esc(s?s.name:'该生')+' 移出此座位（可在“未入座学生”重新入座）？',function(){ db.seat.matrix[c][r]=null; save(); seatSel=null; render(); toast('已移出'); }); }

function seatAddUnseated(sid){

function seatPlace(c,r,sid){ db.seat.matrix[c][r]=sid; save(); try{closeSheet();}catch(e){} render(); toast('已入座'); }
function seatExportPNG(){

  matrix.forEach(function(col,ci){ col.forEach(function(s,ri){ const x=pad+ci*cw,y=titleH+hh+ri*ch;
    ctx.fillStyle=s?(s.special?'#fdf3c2':'#fff'):'#f2f2f2'; ctx.fillRect(x+3,y+3,cw-6,ch-6);
    if(s){ ctx.strokeStyle='#cfcfcf'; ctx.strokeRect(x+3,y+3,cw-6,ch-6); ctx.fillStyle=s.special?'#a9791a':'#333'; ctx.font='15px sans-serif'; ctx.fillText(s.name+(s.special?'☆':''), x+cw/2, y+ch/2+5); } });

let dutySt={groups:9,byPlan:true,_init:0};
function dutyHTML(){
  initDuty();
  const st=dutySt;
  const tools='<div class="gen-tools no-print">'
    +'<div class="field"><label>组数</label><input type="number" min="3" max="12" value="'+st.groups+'" onchange="dutySet(\'groups\',this.value)"></div>'
    +'<div class="field check-mini"><input type="checkbox" '+(st.byPlan?'checked':'')+' onchange="dutySet(\'byPlan\',this.checked)"><label>用预设分组</label></div>'
    +'<button class="btn mini" onclick="dutyRebuild()">🔄 重新分</button>'
    +'<button class="btn mini soft" onclick="dutyExportPNG()">🖼️ 导出图片</button>'
    +'<button class="btn mini ghost" onclick="dutyPrint()">🖨️ 打印</button>'
    +'</div>';
  return tools+dutyTableHTML();
}
function initDuty(){ if(!dutySt._init){ if(db.dutyPlan&&db.dutyPlan.length){ dutySt.groups=db.dutyPlan.length; } else { dutySt.groups=Math.max(3,Math.min(9,Math.ceil(db.students.length/6))); } dutySt._init=1; } }
function dutySet(k,v){ if(k==='groups')dutySt.groups=Math.max(3,parseInt(v)||9); else dutySt[k]=v; render(); }
function dutyNorm(grp){
  if(Array.isArray(grp)){ const a=grp.slice(); const trash=a.splice(0,2); const corridor=a.splice(0,1); const window=a.splice(0,1); return {sweep:a,corridor:corridor,window:window,trash:trash}; }
  return {sweep:(grp.sweep||[]).slice(),corridor:(grp.corridor||[]).slice(),window:(grp.window||[]).slice(),trash:(grp.trash||[]).slice()};
}
function dutyBuild(){
  const n=dutySt.groups;
  if(dutySt.byPlan&&db.dutyPlan&&db.dutyPlan.length)return db.dutyPlan.slice();
  const names=db.students.map(function(s){return s.name;}); const g=Array.from({length:n},function(){return [];});
  names.forEach(function(nm,i){ g[i%n].push(nm); }); db.dutyPlan=g.map(function(x){return x.slice();}); return g;
}
function dutyRebuild(){ const names=db.students.map(function(s){return s.name;}); shuffle(names); const n=dutySt.groups; const g=Array.from({length:n},function(){return [];}); names.forEach(function(nm,i){ g[i%n].push(nm); }); db.dutyPlan=g.map(function(x){return x.slice();}); dutySt.byPlan=true; save(); render(); toast('已重新分组'); }
function dutyTableHTML(){
  const g=dutyBuild(); const n=g.length;
  const rows=g.map(function(grp,gi){ const d=dutyNorm(grp);
    const td=function(arr){ return arr.length?arr.map(function(x){return esc(x);}).join('<br>'):'—'; };
    return '<tr><td class="nm">第'+(gi+1)+'天</td><td>'+td(d.sweep)+'</td><td>'+td(d.corridor)+'</td><td>'+td(d.window)+'</td><td>'+td(d.trash)+'</td></tr>'; }).join('');
  const intro='<div class="gtitle" style="padding:12px 16px 0">🧹 卫生值日表 · '+esc(db.className)+'（'+n+'组 · 每天一组轮流）</div>';
  const note='<div class="seat-tip">任务来自值日分工表 · 扫地 + 扫走廊1 + 窗台1 + 倒垃圾 · 第'+n+'组后从第1组重新轮换</div>';
  return '<div class="duty-table-wrap">'+intro+'<div style="overflow-x:auto"><table class="duty"><thead><tr><th>值日天数</th><th>扫地</th><th>扫走廊（1人）</th><th>窗台（1人）</th><th>倒垃圾（2人）</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+note+'</div>';
}
function dutyExportPNG(){

    return '<div class="cell"><div class="t">'+esc(fmtCN(d.date))+' · <span class="chip" style="padding:0 8px;font-size:11px">'+esc(classLabel(d.cls||'2612'))+'</span><div style="font-size:15px;font-weight:600;margin-top:2px">'+esc(names)+'</div><div class="sub" style="color:#999">'+esc(cat)+(d.note?(' · '+esc(d.note)):'')+'</div></div><span class="val" style="color:'+(sc<0?'#fa5151':'#07c160')+'">'+(sc>0?'+':'')+sc+'分</span><span class="chev" style="cursor:pointer" onclick="discDel(\''+d.id+'\')">删</span></div>';

  const seg='<div class="seg">'+[{k:'all',n:'全部'},{k:'2612',n:'12班'},{k:'2610',n:'10班'}].map(function(x){return '<button class="'+(discCls===x.k?'on':'')+'" onclick="discCls=\''+x.k+'\';render()">'+x.n+'</button>';}).join('')+'</div>';
  return '<div class="btn-row" style="padding:12px 14px"><button class="btn" onclick="discAdd()">＋ 记录课堂纪律</button></div>'
    +seg
    +'<div class="gtitle" style="padding:12px 16px 0">课堂纪律 · 累计 '+(total>0?'+':'')+total+' 分</div>'
    +'<div class="cgroup">'+(cards||emptyHTML('📏','还没有纪律记录，点击上方记录'))+'</div>';
}
function discClsChips(cls){
  const students=studentOfCls(cls);
  const el=document.getElementById('di_stu'); if(!el)return;
  el.innerHTML=students.map(function(s){return '<span class="chip" data-sel="0" data-name="'+esc(s.name)+'" onclick="discPick(this)">'+esc(s.name)+'</span>';}).join('');
}
function discPick(el){ el.setAttribute('data-sel', el.getAttribute('data-sel')==='1'?'0':'1'); el.classList.toggle('on'); }
function discAdd(){
  const cls=discCls==='all'?'2612':discCls;
  const chips=studentOfCls(cls).map(function(s){return '<span class="chip" data-sel="0" data-name="'+esc(s.name)+'" onclick="discPick(this)">'+esc(s.name)+'</span>';}).join('');
  openSheet({title:'记录课堂纪律',
    body:'<div class="fcell"><label>日期</label><input id="di_date" type="date" value="'+todayStr()+'"></div>'
      +'<div class="fcell"><label>班级</label><select id="di_cls" onchange="discClsChips(this.value)"><option value="2612">12班</option><option value="2610">10班</option></select></div>'
      +'<div class="fcell" style="display:block"><label>学生（点选可多选，不选=全班）</label><div class="chips" id="di_stu" style="padding:6px 0">'+chips+'</div></div>'
      +'<div class="fcell"><label>类型</label><select id="di_cat"><option value="talk">课堂讲话</option><option value="sleep">打瞌睡</option><option value="phone">玩手机</option><option value="late">迟到</option><option value="noise">扰乱课堂</option><option value="hw">作业未交</option><option value="good">课堂表现好</option><option value="other">其他</option></select></div>'
      +'<div class="fcell"><label>分值</label><select id="di_score"><option value="-1">扣1</option><option value="-2">扣2</option><option value="-3">扣3</option><option value="-5">扣5</option><option value="-10">扣10</option><option value="1">加1</option><option value="2">加2</option><option value="3">加3</option><option value="5">加5</option></select></div>'
      +'<div class="fcell"><label>备注</label><input id="di_note" placeholder="可选，例如 第三节英语课"></div>',
    onSave:function(){
      const names=[]; document.querySelectorAll('#di_stu .chip[data-sel="1"]').forEach(function(el){names.push(el.getAttribute('data-name'));});
      const rec={id:uid(),date:($('#di_date').value||todayStr()),cls:$('#di_cls').value,cat:$('#di_cat').value,score:parseInt($('#di_score').value,10)||-1,names:names,note:($('#di_note').value||'').trim()};
      (db.discipline=db.discipline||[]).push(rec); save(); render(); toast('已记录');
    },ok:'保存'});
}
function discDel(id){confirmBox('删除这条纪律记录？',function(){db.discipline=(db.discipline||[]).filter(function(d){return d.id!==id;}); save(); render(); toast('已删除');});}

/* ================== 班级设置与模板 ================== */
function classSettings(){
  openSheet({title:'班级设置',body:
    '<div class="fcell"><label>班级名称</label><input id="cls_name" value="'+esc(db.className)+'"></div>'
    +'<div class="fcell"><label>学校</label><input id="cls_school" value="'+esc(db.school)+'"></div>'
    +'<div class="fcell"><label>教师</label><input id="cls_teach" value="'+esc(db.teacherName)+'"></div>'
    +'<div class="cgroup" style="margin-top:10px"><div class="gtitle">载入班级模板（会替换学生与相关记录）</div>'
    +'<div class="btn-row" style="padding:6px 0 12px"><button class="btn mini ghost" onclick="loadClassSample10()">示例班级 10 人</button><button class="btn mini ghost" onclick="loadClass2612()">2612 班 55 人</button></div></div>',
    onSave:function(){ db.className=$('#cls_name').value.trim()||db.className; db.school=$('#cls_school').value.trim(); db.teacherName=$('#cls_teach').value.trim(); save(); render(); toast('已保存班级设置'); }
  });
}
function applyTemplate(d){
  try{ closeSheet(); }catch(e){}
  if(!d.school)d.school='一中'; if(!d.teacherName)d.teacherName='黄思敏';
  if(!d.dictations)d.dictations=[]; if(!d.homeworks)d.homeworks=[]; if(!d.exams)d.exams=[];
  if(!d.attendance)d.attendance={}; if(!d.logs)d.logs=[]; if(!d.contacts)d.contacts=[]; if(!d.checkinTasks)d.checkinTasks=[]; if(!d.checkins)d.checkins=[];
  if(!d.classes)d.classes=['2612']; if(!d.students10)d.students10=[]; if(!d.classSchedule10)d.classSchedule10=[];
  (d.students||[]).forEach(function(s){ if(!s.cls)s.cls='2612'; });
  (d.students10||[]).forEach(function(s){ if(!s.cls)s.cls='2610'; });
  db=d; save(); seatSt._init=0; dutySt._init=0; render(); toast('已载入班级：'+db.className);
}
function loadClassSample10(){ applyTemplate(defaultData()); }
function loadClass2612(){ applyTemplate(makeClass2612()); }
function makeClass2612(){
  const gLabels=['第一组','第二组','第三组','第四组','第五组','第六组','第七组','第八组'];
  const students=S2612_ROSTER.map(function(r,i){
    return {id:uid(),no:String(i+1).padStart(2,'0'),name:r[0],gender:r[1]||'男',phone:r[2]||'',parent:r[3]||'',group:'',special:0,cls:'2612'};
  });
  const students10=S2610_ROSTER.map(function(r,i){
    return {id:uid(),no:String(i+1).padStart(2,'0'),name:r[0],gender:r[1]||'男',phone:r[2]||'',parent:r[3]||'',group:'',special:0,cls:'2610'};
  });
  const nameToGroup={};
  S2612_SEAT.forEach(function(col,ci){ col.forEach(function(nm){ if(nm)nameToGroup[nm]=gLabels[ci]; }); });
  students.forEach(function(s){ s.group=nameToGroup[s.name]||''; });
  const nameToId={}; students.forEach(function(s){ nameToId[s.name]=s.id; });
  const seatMatrix=S2612_SEAT.map(function(col){ return col.map(function(nm){ return nm?nameToId[nm]:null; }); });
  const dutyPlan=S2612_DUTY.map(function(d){
    const arr=[];
    (d.trash||[]).forEach(function(x){arr.push(x);});
    (d.corridor||[]).forEach(function(x){arr.push(x);});
    (d.window||[]).forEach(function(x){arr.push(x);});
    (d.sweep||[]).forEach(function(x){arr.push(x);});
    return arr;
  });
  const eveByDay=['晚自习听力/黄思敏','晚自习听力/黄思敏','晚自习','班会/黄思敏','晚自习'];
  const classSchedule=S2612_CLASS12.map(function(row,di){ return row.concat([eveByDay[di]||'晚自习']); });
  const eng10=[[0,0],[0,1],[1,4],[2,3],[3,6],[4,1]];
  const eve10=['晚自习听力/黄思敏','晚自习听力/黄思敏','晚自习','晚自习','晚自习'];
  const classSchedule10=classSchedule.map(function(row,di){
    const out=row.slice();
    for(let p=0;p<8;p++){ if(out[p]&&out[p].indexOf('英语')>=0){ out[p]=''; } }
    eng10.forEach(function(x){ if(x[0]===di) out[x[1]]='英语/黄思敏'; });
    if(out[7]&&out[7].indexOf('班会')>=0)out[7]='班会/';
    out[8]=eve10[di]||'晚自习';
    return out;
  });
  return {teacherName:'黄思敏',school:'昌济中学',className:'2612班',seeded:true,rev:4,
    students:students,students10:students10,classes:['2612','2610'],exams:[],
    dictations:[],homeworks:[],attendance:{},
    checkinTasks:[{id:uid(),name:'早读英语带读'},{id:uid(),name:'检查学生背诵'},{id:uid(),name:'批改今日默写'},{id:uid(),name:'处理班级事务'},{id:uid(),name:'备课/教学反思'}],
    checkins:[],logs:[],contacts:[],dutyPlan:dutyPlan,dormDeducts:[],
    seatPreset:{groups:8,rows:7},seat:{groups:gLabels,matrix:seatMatrix,rows:7},
    dorm:S2612_DORM,dormSex:S2612_DORM_SEX,dormRev:2,
    classSchedule:classSchedule,classSchedule10:classSchedule10,teacherSchedule:S2612_TEACHER,times:S2612_TIMES};
}

/* ================== 启动 ================== */
seedIfNeeded();
(function(){const h=location.hash.replace(/^#/,''); if(h){route=h;} render();
  window.addEventListener('hashchange',function(){route=location.hash.replace(/^#/,'')||'home'; render();});
  pushHistory();
  window.addEventListener('popstate',function(){ setTimeout(popBack,0); });
})();

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}</script>
